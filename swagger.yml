openapi: 3.0.3
info:
  title: Kira Payment Link API
  version: 1.0.0
  description: >
    API to create payment links in USD, preview fees and FX,
    process payments with mocked PSP orchestration and handle simulated webhooks.

servers:
  - url: https://kira-payment-api.onrender.com
    description: Staging

tags:
  - name: PaymentLinks
    description: CRUD and retrieval of payment links
  - name: Payments
    description: Payment processing on a payment link
  - name: Webhooks
    description: Reception of mocked PSP callbacks
  - name: Health
    description: Service health

paths:
  /payment-links:
    post:
      tags: [PaymentLinks]
      summary: Create a payment link
      description: >
        Creates a new payment link in USD, associating the merchant's
        fee configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentLinkRequest'
      responses:
        '201':
          description: Payment link created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkResponse'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-links/{id}:
    get:
      tags: [PaymentLinks]
      summary: Get a payment link with fee preview
      description: >
        Returns the payment link, the current FX rate (with jitter) and the
        fee calculation to display in the checkout (including incentives if applicable).
      parameters:
        - name: id
          in: path
          required: true
          description: Payment link ID
          schema:
            type: string
        - name: withFeePreview
          in: query
          required: false
          description: >
            If true, calculates the fee preview in real time
            and the amount in MXN (default true).
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Payment link found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkWithPreviewResponse'
        '404':
          description: Payment link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payment-links/{id}/payments:
    post:
      tags: [Payments]
      summary: Process a payment on a payment link
      description: >
        Processes a payment using a card token issued by the mock PSP (Stripe or Adyen),
        applies the FX rate in real time, calculates fees and executes synchronous
        orchestration with failover between PSPs.
      parameters:
        - name: id
          in: path
          required: true
          description: Payment link ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProcessPaymentRequest'
      responses:
        '200':
          description: Payment processed (successful or failed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessPaymentResponse'
        '400':
          description: Invalid request (invalid token, amount out of limit, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Payment link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Idempotency conflict (payment already processed with the same key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /webhooks/psp:
    post:
      tags: [Webhooks]
      summary: Mocked PSP webhook
      description: >
        Endpoint where Stripe/Adyen mock services send simulated callbacks
        for payment events (payment.succeeded, payment.failed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PSPWebhookEvent'
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAckResponse'
        '400':
          description: Invalid webhook
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /health:
    get:
      tags: [Health]
      summary: Service healthcheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    Money:
      type: object
      properties:
        currency:
          type: string
          example: USD
        amount:
          type: number
          format: double
          example: 100.0

    CreatePaymentLinkRequest:
      type: object
      required:
        - merchantId
        - amountUsd
      properties:
        merchantId:
          type: string
          example: merchant_123
        amountUsd:
          type: number
          format: double
          minimum: 1
          maximum: 5000
          example: 100.0
        description:
          type: string
          example: "Consulting service payment"
        expiresAt:
          type: string
          format: date-time
          description: Optional link expiration date
        feeConfigOverride:
          description: >
            Optional fee configuration specific to this link.
            If omitted, the merchant's default configuration is used.
          type: object
          properties:
            fixedFeeUsd:
              type: number
              format: double
              example: 0.3
            variableFeePercent:
              type: number
              format: double
              example: 0.029
            fxMarkupPercent:
              type: number
              format: double
              example: 0.015
            firstTxFreeCount:
              type: integer
              example: 3

    PaymentLinkResponse:
      type: object
      properties:
        id:
          type: string
          example: plink_cu9r2y8s7
        merchantId:
          type: string
          example: merchant_123
        status:
          type: string
          enum: [DRAFT, ACTIVE, EXPIRED, COMPLETED, CANCELLED]
        amountUsd:
          type: number
          format: double
          example: 100.0
        description:
          type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        checkoutUrl:
          type: string
          example: "https://pay.kira.com/checkout/plink_cu9r2y8s7"

    FeePreview:
      type: object
      properties:
        fxRate:
          type: number
          format: double
          example: 18.5
        totalFeesUsd:
          type: number
          format: double
          example: 3.2
        recipientAmountMxn:
          type: number
          format: double
          example: 1850.0
        breakdown:
          type: object
          properties:
            fixedFeeUsd:
              type: number
              format: double
            variableFeeUsd:
              type: number
              format: double
            fxMarkupUsd:
              type: number
              format: double
            firstTxDiscountUsd:
              type: number
              format: double

    PaymentLinkWithPreviewResponse:
      allOf:
        - $ref: '#/components/schemas/PaymentLinkResponse'
        - type: object
          properties:
            feePreview:
              $ref: '#/components/schemas/FeePreview'

    ProcessPaymentRequest:
      type: object
      required:
        - cardToken
        - pspProvider
        - idempotencyKey
      properties:
        cardToken:
          type: string
          example: "tok_mock_stripe_1699564823_a3f7e2"
        pspProvider:
          type: string
          description: Preferred PSP for the first attempt.
          enum: [STRIPE, ADYEN]
        idempotencyKey:
          type: string
          example: "pay_merchant123_2025-11-17T10:15:00Z"
        metadata:
          type: object
          additionalProperties: true
          example:
            customerEmail: "user@example.com"
            customerName: "John Doe"

    ProcessPaymentResponse:
      type: object
      properties:
        transactionId:
          type: string
          example: "tx_abc123"
        status:
          type: string
          description: The final synchronous state of the transaction.
          enum: [COMPLETED, FAILED]
        paymentLinkId:
          type: string
        pspProvider:
          type: string
          description: The PSP that successfully processed or finally failed.
          enum: [STRIPE, ADYEN]
        amountUsd:
          type: number
          format: double
          example: 103.2
        recipientAmountMxn:
          type: number
          format: double
          example: 1850.0
        fxRateApplied:
          type: number
          format: double
          example: 18.5
        totalFeesUsd:
          type: number
          format: double
          example: 3.2

    PSPWebhookEvent:
      type: object
      required:
        - provider
        - eventType
        - data
      properties:
        provider:
          type: string
          enum: [STRIPE, ADYEN]
        eventType:
          type: string
          example: "payment.succeeded"
        eventId:
          type: string
          example: "evt_test_123"
        data:
          type: object
          additionalProperties: true
          example:
            transactionId: "tx_abc123"
            pspChargeId: "ch_mock_456"
            status: "succeeded"

    WebhookAckResponse:
      type: object
      properties:
        received:
          type: boolean
          example: true
        processed:
          type: boolean
          example: true

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Bad Request"
        message:
          type: string
          example: "amountUsd must be between 1 and 5000"
        code:
          type: string
          example: "VALIDATION_ERROR"