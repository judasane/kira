version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: kira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kira_payments
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (para desarrollo)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kira-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/kira_payments?schema=public
      CORS_ORIGIN: http://localhost:4200
      BASE_URL: http://localhost:3000
      CHECKOUT_BASE_URL: http://localhost:4200
      FX_SERVICE_BASE_RATE: 18.5
      FX_SERVICE_JITTER_PERCENT: 2.0
      STRIPE_MOCK_SUCCESS_RATE: 0.85
      ADYEN_MOCK_SUCCESS_RATE: 0.80
      PSP_MOCK_LATENCY_MS_MIN: 100
      PSP_MOCK_LATENCY_MS_MAX: 500
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: 5
      CIRCUIT_BREAKER_TIMEOUT_MS: 60000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run dev"

volumes:
  postgres_data:
